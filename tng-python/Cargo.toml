[package]
name = "tng-python"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings for TNG (Trusted Network Gateway) — in-process OHTTP encryption for confidential AI"

[lib]
name = "tng_python"
crate-type = ["cdylib"]

[dependencies]
anyhow = { workspace = true }
portpicker = { workspace = true }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
serde_json = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["rt-multi-thread", "time", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustls = { workspace = true }

[target.'cfg(not(all(target_arch = "wasm32", target_vendor = "unknown", target_os = "unknown")))'.dependencies]
tng = { path = "../tng", default-features = false, features = [
    "ingress-mapping",
    "ingress-http-proxy",
    "ingress-socks5",
    "ingress-netfilter",
    "egress-mapping",
    "egress-netfilter",
    "metric",
    "trace",
] }
