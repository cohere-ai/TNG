# tng-wasm is its own workspace, separate from the root TNG workspace.
#
# The wasm build needs `[patch.crates-io] hyper-util = deps/hyper-util-shim` so that
# transitive dependencies (reqwest, tonic, hyper) pick up a wasm-capable hyper-util.
# Cargo patches are per-workspace and a patched crate can only exist once in a graph,
# which makes that patch incompatible with the native build's dependency set. Keeping
# the wasm build in its own workspace lets it keep the shim while the root workspace
# resolves hyper-util normally.
#
# Dependency versions below are inlined rather than inherited, and must be kept in
# sync with `[workspace.dependencies]` in the root Cargo.toml.
[workspace]

[package]
authors = ["Kun Lai <laikun@linux.alibaba.com>", "Cohere"]
edition = "2021"
license = "Apache-2.0"
name = "tng-wasm"
repository = "https://github.com/cohere-ai/tng"
version = "0.6.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
anyhow = "1.0.98"
axum = {version = "0.8.4", default-features = false, features = ["json"]}# to disable mio
bytes = "1.10.1"
futures = "0.3.31"
getrandom_0_2 = {package = "getrandom", version = "0.2", features = ["js"]}
getrandom_0_3 = {package = "getrandom", version = "0.3", features = ["wasm_js"]}
gloo = {version = "0.11.0", features = ["utils", "net"]}
hex = "0.4.3"
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = {version = "1", default-features = false, features = ["http1", "http2", "client"]}
js-sys = "0.3.77"
serde = {version = "1.0", features = ["derive"]}
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.140"
tng = {path = "../tng", default-features = false, features = ["__ingress-common"]}
tokio = {version = "1.47.1", default-features = false, features = ["sync"]}
tokio-graceful = {version = "0.2.2", default-features = false}
tracing = "0.1"
tracing-log = "0.2.0"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2.84"
wasm-bindgen-futures = "0.4.50"
wasm-streams = "0.4.2"
web-sys = {version = "0.3.77", features = ["Headers", "Request", "RequestInit", "Response", "ResponseInit"]}

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = {version = "0.1.7", optional = true}

[target.'cfg(all(target_arch = "wasm32", target_vendor = "unknown", target_os = "unknown"))'.dependencies]
tokio_with_wasm = {version = "=0.8.6", features = ["rt", "macros", "time"]}
tokio_with_wasm_proc = "=0.8.6"

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

# https://github.com/rustwasm/wasm-pack/issues/1351#issuecomment-2100231587
[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
# this works the same as `--keep-debug` in wasm-bindgen
dwarf-debug-info = true

[patch.crates-io.rustls]
branch = "v/0.23.27-patched"
git = "https://github.com/inclavare-containers/rustls.git"

[patch.crates-io.rustls-webpki]
branch = "v/0.103.3-patched"
git = "https://github.com/inclavare-containers/webpki.git"

[patch.crates-io.reqwest]
git = "https://github.com/inclavare-containers/reqwest.git"
rev = "edd4658e698a030ff04bbb62e954f363b31a25c8"

[patch.crates-io.tokio-graceful]
branch = "wasm"
git = "https://github.com/inclavare-containers/tokio-graceful.git"

[patch.crates-io]
hyper-util = {path = "../deps/hyper-util-shim"}

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
