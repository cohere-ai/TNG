[package]
authors = ["Kun Lai <laikun@linux.alibaba.com>"]
edition.workspace = true
license.workspace = true
name = "rats-cert"
version.workspace = true

[dependencies]
anyhow = {workspace = true}
as-any = {workspace = true}
async-trait = {workspace = true}
attestation-service = {workspace = true, optional = true}
base64 = {workspace = true}
bitflags = {workspace = true}
bytes = {workspace = true}
serde_json_canonicalizer = {workspace = true, optional = true}
ciborium = {workspace = true}
const-oid = {workspace = true, optional = true}
flatten-json-object = {workspace = true, optional = true}
futures = {workspace = true}
hex = {workspace = true}
itertools = {workspace = true}
jsonwebtoken = {workspace = true}
kbs-types = {workspace = true}
key-value-storage = {workspace = true, optional = true}
p256 = {workspace = true, optional = true}
pkcs8 = {workspace = true, optional = true}
prost = {workspace = true, optional = true}
protobuf = {workspace = true, optional = true}
rand = "0.8.5"
reqwest = {workspace = true, optional = true}
ring = {workspace = true, optional = true}
rsa = {workspace = true, optional = true}
rustls-pki-types = {workspace = true, optional = true}
rustls-webpki = {workspace = true, optional = true}
serde = {workspace = true}
serde_bytes = {workspace = true}
serde_json = {workspace = true}
sha2 = {workspace = true, optional = true}
signature = {workspace = true, optional = true}
spin = {workspace = true}
strum = {workspace = true, features = ["derive"]}
strum_macros = {workspace = true}
thiserror = {workspace = true}
tonic-prost = {workspace = true, optional = true}
tracing = {workspace = true}
ttrpc = {workspace = true, optional = true}
x509-cert = {workspace = true, optional = true}
zeroize = {workspace = true}

[target.'cfg(not(all(target_arch = "wasm32", target_vendor = "unknown", target_os = "unknown")))'.dependencies]
time = {workspace = true, features = ["std"]}
tokio = {workspace = true, default-features = true, features = ["fs"]}
tonic = {workspace = true, default-features = false, features = ["codegen", "channel"], optional = true}

[target.'cfg(all(target_arch = "wasm32", target_vendor = "unknown", target_os = "unknown"))'.dependencies]
time = {workspace = true, features = ["std", "wasm-bindgen"]}
tokio = {workspace = true, default-features = false}
tokio_with_wasm = {workspace = true}
tonic = {workspace = true, default-features = false, features = ["codegen"], optional = true}
tonic-web-wasm-client = {workspace = true}
web-time = {workspace = true}

[features]
attester-coco = [
  "dep:ttrpc-codegen",
  "dep:ttrpc",
  "dep:protobuf",
  "dep:prost",
  "dep:rustls-webpki",
  "dep:rustls-pki-types",
  "dep:reqwest",
  "dep:flatten-json-object",
  "dep:serde_json_canonicalizer",
]
verifier-coco = [
  "dep:tonic-prost-build",
  "dep:tonic-prost",
  "dep:tonic",
  "dep:protobuf",
  "dep:prost",
  "dep:rustls-webpki",
  "dep:rustls-pki-types",
  "dep:reqwest",
  "dep:flatten-json-object",
]

attester-ita = [
  "attester-coco",
]
verifier-ita = [
  "dep:reqwest",
  "dep:flatten-json-object",
]

crypto-rustcrypto = [
  "dep:x509-cert",
  "dep:sha2",
  "dep:p256",
  "dep:rsa",
  "dep:pkcs8",
  "dep:const-oid",
  "dep:signature",
  "dep:rustls-webpki",
  "dep:rustls-pki-types",
]

# In-process attestation service backed by upstream CoCo Trustee. Deliberately kept out of
# `default`, the same way `tng` opts in explicitly with `default-features = false`.
# `__coco-builtin-as` alone builds the service with no verifiers, which is only useful for
# checking the wiring; each TEE has to be enabled on its own because the verifiers carry
# native dependencies (openssl, tss-esapi, DCAP).
__coco-builtin-as = ["dep:attestation-service", "dep:key-value-storage"]
coco-builtin-as-azsnp = ["__coco-builtin-as", "attestation-service/az-snp-vtpm-verifier"]
coco-builtin-as-aztdx = ["__coco-builtin-as", "attestation-service/az-tdx-vtpm-verifier"]
coco-builtin-as-nvidia = ["__coco-builtin-as", "attestation-service/nvidia-verifier"]
coco-builtin-as-sgx = ["__coco-builtin-as", "attestation-service/sgx-verifier"]
coco-builtin-as-snp = ["__coco-builtin-as", "attestation-service/snp-verifier"]
coco-builtin-as-tdx = ["__coco-builtin-as", "attestation-service/tdx-verifier"]
coco-builtin-as-all = [
  "coco-builtin-as-azsnp",
  "coco-builtin-as-aztdx",
  "coco-builtin-as-nvidia",
  "coco-builtin-as-sgx",
  "coco-builtin-as-snp",
  "coco-builtin-as-tdx",
]

default = ["crypto-rustcrypto", "attester-coco", "verifier-coco", "attester-ita", "verifier-ita"]

[dev-dependencies]
ctor = {workspace = true}
# Tests build signing keys from PEM; the non-test build only needs JWK/RSA-component keys.
jsonwebtoken = {workspace = true, features = ["use_pem"]}
rayon = {workspace = true}
rsa = {workspace = true}
rstest = {workspace = true}
serial_test = {workspace = true}
tempfile = {workspace = true}
# Held at 0.16.1 in the lockfile: 0.16.4 raises its MSRV to rustc 1.95, past this repo's 1.89.
test-with = {version = "0.16.1", default-features = false}
tokio = {workspace = true, features = ["rt", "rt-multi-thread", "macros"]}
tracing-subscriber = {workspace = true}
wiremock = "0.6"

[build-dependencies]
tonic-prost-build = {workspace = true, optional = true}
ttrpc-codegen = {workspace = true, optional = true}
