[package]
name = "intel-tee-quote-verification-sys"
version = "0.3.0"
edition = "2021"
links = "sgx_dcap_quoteverify"
license = "BSD-3-Clause"
description = "Intel(R) TEE Quote Verification Rust Library"
documentation = "https://intel.github.io/confidential-computing.tee.dcap/docs/rust-qvl-doc/intel_tee_quote_verification_sys"
readme = "README.md"
homepage = "https://github.com/intel/confidential-computing.tee.dcap"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Not called from Rust: the library calls OpenSSL, and linking it through openssl-sys puts it
# on the same OpenSSL as the rest of the process (vendored in the wheel). openssl-sys also
# hands its include directory to build.rs as DEP_OPENSSL_INCLUDE.
openssl-sys = "0.9"

[build-dependencies]
bindgen = "0.70.1"
cc = "1.2"
