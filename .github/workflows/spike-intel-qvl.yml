name: Spike Intel QVL portable build

# Throwaway: can Intel's libsgx_dcap_quoteverify be built from source for every cohere-tng
# wheel target, and does it give the same answers as Intel's packaged library? See
# spike/intel-qvl. Push-triggered so it runs from the branch without being on the default one.
on:
  push:
    branches: ['spike/**']
    paths:
      - 'spike/intel-qvl/**'
      - '.github/workflows/spike-intel-qvl.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: spike/intel-qvl

jobs:
  # Intel's packaged library on x86-64 Linux against the committed expectations, so a pass
  # elsewhere means "matches Intel's build", not just "matches itself".
  baseline-intel-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Intel's libsgx-dcap-quote-verify
        run: |
          sudo curl --proto '=https' --tlsv1.2 -fsSL https://download.01.org/intel-sgx/sgx_repo/ubuntu/intel-sgx-deb.key \
            -o /etc/apt/keyrings/intel-sgx.asc
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/intel-sgx.asc] https://download.01.org/intel-sgx/sgx_repo/ubuntu noble main" \
            | sudo tee /etc/apt/sources.list.d/intel-sgx.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsgx-dcap-quote-verify-dev
          dpkg -l libsgx-dcap-quote-verify | tail -1
      - run: QVL_USE_SYSTEM_LIB=1 cargo build --release -p qvl-spike-verify
      - run: ldd target/release/qvl-spike-verify | grep sgx_dcap_quoteverify
      - run: ./check.sh target/release/qvl-spike-verify

  # Native runners, with bindgen. The macOS deployment targets are the ones maturin gives the
  # published wheels (macosx_10_12_x86_64, macosx_11_0_arm64).
  source-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, os: ubuntu-24.04}
          - {name: linux-aarch64, os: ubuntu-24.04-arm}
          - {name: macos-arm64, os: macos-15, macos_target: '11.0'}
          - {name: macos-x86_64, os: macos-15-intel, macos_target: '10.12'}
    name: source-build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
    steps:
      - uses: actions/checkout@v6
      - run: ./fetch-sources.sh "$RUNNER_TEMP/intel-src" >> "$GITHUB_ENV"
      - run: cargo build --release -p qvl-spike-verify --features vendored-openssl
      - name: Show what the binary links
        run: |
          file target/release/qvl-spike-verify
          if [ "$RUNNER_OS" = macOS ]; then
            otool -L target/release/qvl-spike-verify
            otool -l target/release/qvl-spike-verify | grep -A3 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX'
          else
            ldd target/release/qvl-spike-verify
          fi
      - run: ./check.sh target/release/qvl-spike-verify
      # The manylinux jobs use the committed glibc bindings; prove a native glibc build on
      # either architecture generates exactly that file.
      - name: Compare bindgen output with sys/bindings/linux-glibc.rs
        if: runner.os == 'Linux'
        run: diff -u sys/bindings/linux-glibc.rs target/release/build/intel-tee-quote-verification-sys-*/out/bindings.rs

  # The images maturin-action builds the published Linux wheels in, run the way it runs them.
  manylinux2014-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: ./fetch-sources.sh "$RUNNER_TEMP/intel-src"
      - run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/io" -v "$RUNNER_TEMP/intel-src:/intel-src:ro" \
            quay.io/pypa/manylinux2014_x86_64:latest bash /io/spike/intel-qvl/ci/container-build.sh

  manylinux_2_28-cross-aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: ./fetch-sources.sh "$RUNNER_TEMP/intel-src"
      - run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/io" -v "$RUNNER_TEMP/intel-src:/intel-src:ro" \
            ghcr.io/rust-cross/manylinux_2_28-cross:aarch64 \
            bash /io/spike/intel-qvl/ci/container-build.sh aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@v6
        with:
          name: cross-aarch64-verify
          path: spike/intel-qvl/target-container/aarch64-unknown-linux-gnu/release/qvl-spike-verify

  # The cross-compiled binary cannot run where it was built.
  manylinux_2_28-cross-aarch64-run:
    needs: manylinux_2_28-cross-aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: cross-aarch64-verify
          path: spike/intel-qvl/cross
      - run: chmod +x cross/qvl-spike-verify && ldd cross/qvl-spike-verify
      - run: ./check.sh cross/qvl-spike-verify
