name: Cohere Build Docker

on:
  push:
    branches:
      - cohere
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

jobs:
  # All images come from one bake build with no imported cache, so the shared stages are built once
  # on this runner from this checkout alone.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          flavor: |
            latest=auto
          tags: |
            type=raw,value=cohere,enable=${{ github.ref == 'refs/heads/cohere' && inputs.version == '' }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=ref,event=branch,enable=${{ inputs.version == '' }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: bake
        uses: docker/bake-action@v7
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        with:
          source: .
          files: |
            cohere/docker/docker-bake.hcl
            ${{ steps.meta.outputs.bake-file-labels }}
          push: true

      - name: Collect image digests
        id: images
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          images=$(jq -c '[to_entries[] | select(.value | type == "object" and has("containerimage.digest"))
            | {name: .key,
               image: (.value["image.name"] | split(",")[0] | sub(":[^:/]+$"; "")),
               digest: .value["containerimage.digest"]}]' <<< "$METADATA")
          echo "$images" | jq .
          echo "images=$images" >> "$GITHUB_OUTPUT"

  attest:
    needs: [build]
    strategy:
      matrix:
        include: ${{ fromJSON(needs.build.outputs.images) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ matrix.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ matrix.image }}@${{ matrix.digest }}
          output-file: sbom-${{ matrix.name }}.spdx.json
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ matrix.digest }}
          sbom-path: sbom-${{ matrix.name }}.spdx.json
          push-to-registry: true
