name: Cohere Build Docker

on:
  push:
    branches:
      - cohere
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: egress
            image: ghcr.io/cohere-ai/tng
          - target: ingress
            image: ghcr.io/cohere-ai/tng-ingress
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=cohere,enable=${{ github.ref == 'refs/heads/cohere' }}
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          file: cohere/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Only one matrix leg creates the GitHub Release to avoid duplicates.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'egress'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          output-file: sbom-${{ matrix.target }}.spdx.json

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.target }}.spdx.json
          push-to-registry: true
