name: Cohere Rust Format Check

on:
  push:
    branches:
      - cohere
    tags:
      - "v*.*.*"
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt

      - name: Check code formatting
        run: cargo fmt --check