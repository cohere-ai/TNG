name: Cohere Build Python

on:
  push:
    branches: [cohere, tng-python]  # remove tng-python before merging
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-tng:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64,  manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: manylinux_2_28 }
          - { os: macos-13,      target: x86_64 }
          - { os: macos-14,      target: aarch64 }
          - { os: windows-latest, target: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: tng-python
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux || 'auto' }}
          before-script-linux: |
            ARCH=$(uname -m)
            if [ "$ARCH" = "aarch64" ]; then PROTOC_ARCH="linux-aarch_64"; else PROTOC_ARCH="linux-x86_64"; fi
            curl -Lo /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-${PROTOC_ARCH}.zip"
            python3 -c "import zipfile; zipfile.ZipFile('/tmp/protoc.zip').extractall('/usr/local')"
            chmod +x /usr/local/bin/protoc
            protoc --version
      - uses: actions/upload-artifact@v4
        with:
          name: tng-${{ matrix.os }}-${{ matrix.target }}
          path: tng-python/dist/*.whl

  build-conceil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install build setuptools-scm
      - run: python -m build --wheel
        working-directory: cohere/conceil
      - uses: actions/upload-artifact@v4
        with:
          name: conceil
          path: cohere/conceil/dist/*.whl

  merge-wheels:
    needs: [build-tng, build-conceil]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: all-wheels
          pattern: '*'
          delete-merged: true

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [merge-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: all-wheels, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
