name: Cohere Build Python

on:
  push:
    branches: [cohere]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-cohere-tng:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64,  manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: manylinux_2_28 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: macos-14,      target: aarch64 }
          # - { os: windows-latest, target: x86_64 }  # tng crate doesn't compile on Windows yet
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - if: runner.os == 'macOS'
        run: brew install protobuf
      - if: runner.os == 'Windows'
        run: choco install protoc -y
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: cohere/python/cohere-tng
          target: ${{ matrix.target }}
          args: --release --out dist --features builtin-verifier-azsnp,builtin-verifier-nvidia
          manylinux: ${{ matrix.manylinux || 'auto' }}
          before-script-linux: |
            # The verifiers link OpenSSL statically via `openssl/vendored`, and
            # OpenSSL 3.x's Configure needs IPC::Cmd. Debian's `perl` bundles the
            # core modules; the RPM-based manylinux images split them out.
            if command -v yum >/dev/null 2>&1; then
              yum install -y perl-core perl-IPC-Cmd
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y perl
            fi
            perl -MIPC::Cmd -e 'print "IPC::Cmd ok\n"'

            ARCH=$(uname -m)
            if [ "$ARCH" = "aarch64" ]; then
              PROTOC_ARCH="linux-aarch_64"
              PROTOC_SHA256="1de522032a8b194002fe35cab86d747848238b5e4de4f99648372079f5b46f9a"
            else
              PROTOC_ARCH="linux-x86_64"
              PROTOC_SHA256="0ad949f04a6a174da83cdcbdb36dee0a4925272a5b6d83f79a6bf9852076d53f"
            fi
            curl -Lo /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-${PROTOC_ARCH}.zip"
            echo "${PROTOC_SHA256}  /tmp/protoc.zip" | sha256sum -c -
            python3 -c "import zipfile; zipfile.ZipFile('/tmp/protoc.zip').extractall('/usr/local')"
            chmod +x /usr/local/bin/protoc
            protoc --version
      # Validate package metadata and README will render correctly on PyPI
      - run: pip install twine && twine check cohere/python/cohere-tng/dist/*.whl
      # A wheel that builds but cannot be loaded is the failure mode static
      # linking is meant to prevent, so prove the extension module actually
      # imports. Skipped on aarch64 Linux, which is cross-built and cannot run
      # on this host.
      - name: Smoke test the wheel
        if: matrix.target == 'x86_64' || runner.os == 'macOS'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install cohere/python/cohere-tng/dist/*.whl
          python3 -c "import cohere_tng; print('import ok', cohere_tng.__file__)"
      # If OpenSSL were linked dynamically, auditwheel/delocate would have copied
      # libssl and libcrypto in here. Their absence is what proves the wheel is
      # self-contained rather than bound to whatever OpenSSL the host happens to
      # ship -- the whole point of building the verifiers with `openssl/vendored`.
      - name: Assert no OpenSSL library was bundled
        shell: bash
        run: |
          WHEEL=$(ls cohere/python/cohere-tng/dist/*.whl)
          if python3 -c "import zipfile,sys; sys.exit(0 if any('libssl' in n or 'libcrypto' in n for n in zipfile.ZipFile(sys.argv[1]).namelist()) else 1)" "$WHEEL"; then
            echo "::error::OpenSSL was bundled as a shared library; vendored/static linking did not take effect"
            exit 1
          fi
          echo "No OpenSSL shared library in $(basename "$WHEEL") - statically linked as intended"
      - uses: actions/upload-artifact@v6
        with:
          name: cohere-tng-${{ matrix.os }}-${{ matrix.target }}
          path: cohere/python/cohere-tng/dist/*.whl

  build-conseel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: pip install build setuptools-scm
      - run: python -m build
        working-directory: cohere/python/conseel
      # Validate package metadata and README will render correctly on PyPI
      - run: pip install twine && twine check cohere/python/conseel/dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: conseel
          path: cohere/python/conseel/dist/*

  merge-cohere-tng-wheels:
    needs: [build-cohere-tng]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v6
        with:
          name: cohere-tng-wheels
          pattern: 'cohere-tng-*'
          delete-merged: true

  # --- Publish (PyPI then GitHub Release) ---
  # Chained sequentially: cohere-tng first (conseel depends on it),
  # then conseel, then GitHub Release only after both succeed.

  publish-cohere-tng:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [merge-cohere-tng-wheels]
    runs-on: ubuntu-latest
    environment: pypi-cohere-tng
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with: { name: cohere-tng-wheels, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-conseel:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish-cohere-tng, build-conseel]
    runs-on: ubuntu-latest
    environment: pypi-conseel
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with: { name: conseel, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish-cohere-tng, publish-conseel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with: { name: cohere-tng-wheels, path: dist }
      - uses: actions/download-artifact@v6
        with: { name: conseel, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
