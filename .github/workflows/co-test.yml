name: Cohere Run Tests on Source Code

on:
  push:
    branches:
      - master
      - cohere
    tags:
      - "v*.*.*"
  pull_request:
    branches:

permissions:
  id-token: write
  contents: read

env:
  GCP_PROJECT: cohere-confidential-computing
  GCP_ZONE: us-central1-a
  VM_PREFIX: tng-test

jobs:
  test:
    name: Test on TDX VM
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Create TDX VM
        id: vm
        run: |
          VM_NAME="${VM_PREFIX}-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "name=$VM_NAME" >> "$GITHUB_OUTPUT"

          gcloud compute instances create "$VM_NAME" \
            --project="$GCP_PROJECT" \
            --zone="$GCP_ZONE" \
            --machine-type=c3-standard-8 \
            --confidential-compute-type=TDX \
            --maintenance-policy=TERMINATE \
            --image-family=ubuntu-2404-lts-amd64 \
            --image-project=ubuntu-os-cloud \
            --boot-disk-size=100GB \
            --boot-disk-type=pd-ssd \
            --no-scopes \
            --no-service-account \
            --network=conf-compute \
            --subnet=conf-compute-subnet \
            --max-run-duration=1h \
            --instance-termination-action=DELETE \
            --labels=purpose=tng-ci,gh-run-id=${{ github.run_id }}

          echo "=== Generating ephemeral SSH key ==="
          ssh-keygen -t ed25519 -f /tmp/ci-ssh-key -N "" -q
          echo "ssh_private_key<<SSHEOF" >> "$GITHUB_OUTPUT"
          cat /tmp/ci-ssh-key >> "$GITHUB_OUTPUT"
          echo "SSHEOF" >> "$GITHUB_OUTPUT"

          echo "=== Adding SSH key to VM metadata ==="
          SSH_USER="cirunner"
          PUB_KEY=$(cat /tmp/ci-ssh-key.pub)
          gcloud compute instances add-metadata "$VM_NAME" \
            --project="$GCP_PROJECT" --zone="$GCP_ZONE" \
            --metadata="ssh-keys=${SSH_USER}:${PUB_KEY}"

          echo "Waiting for VM to accept SSH..."
          for i in $(seq 1 30); do
            if gcloud compute ssh "$VM_NAME" \
              --project="$GCP_PROJECT" --zone="$GCP_ZONE" \
              --tunnel-through-iap --quiet \
              --command="true" 2>/dev/null; then
              echo "VM is ready (attempt $i)"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done

      - name: Install tools on VM
        uses: google-github-actions/ssh-compute@v2
        with:
          instance_name: ${{ steps.vm.outputs.name }}
          zone: ${{ env.GCP_ZONE }}
          project_id: ${{ env.GCP_PROJECT }}
          ssh_private_key: ${{ steps.vm.outputs.ssh_private_key }}
          user: cirunner
          script: |
            set -e
            echo "=== Installing Docker ==="
            curl -fsSL https://get.docker.com | sh

            echo "=== Installing Rust toolchain ==="
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.89.0
            source "$HOME/.cargo/env"
            rustc --version
            cargo --version

            echo "=== Installing system dependencies ==="
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              protobuf-compiler libprotobuf-dev libssl-dev pkg-config clang \
              python3 python3-pip \
              && sudo rm -rf /var/lib/apt/lists/*

      - name: Clone repo and start test dependencies
        uses: google-github-actions/ssh-compute@v2
        with:
          instance_name: ${{ steps.vm.outputs.name }}
          zone: ${{ env.GCP_ZONE }}
          project_id: ${{ env.GCP_PROJECT }}
          ssh_private_key: ${{ steps.vm.outputs.ssh_private_key }}
          user: cirunner
          script: |
            set -e
            source "$HOME/.cargo/env"

            echo "=== Checking TDX device ==="
            ls -la /dev/tdx_guest

            echo "=== Cloning repository ==="
            git clone https://github.com/${{ github.repository }} /workspace
            cd /workspace
            git fetch origin "${{ github.sha }}"
            git checkout "${{ github.sha }}"

            echo "=== Starting AA, AS, cert-proxy, keygen ==="
            cd .github/test-deps
            docker compose up -d --build --wait --wait-timeout 120
            docker compose ps
            cd /workspace

            echo "=== Checking AA socket ==="
            ls -la /run/confidential-containers/attestation-agent/

            echo "=== Verifying cert proxy ==="
            curl -sf http://127.0.0.1:8080/certificate | head -c 200
            echo ""

      - name: Run unit tests
        uses: google-github-actions/ssh-compute@v2
        with:
          instance_name: ${{ steps.vm.outputs.name }}
          zone: ${{ env.GCP_ZONE }}
          project_id: ${{ env.GCP_PROJECT }}
          ssh_private_key: ${{ steps.vm.outputs.ssh_private_key }}
          user: cirunner
          script: |
            set -e
            source "$HOME/.cargo/env"
            cd /workspace

            echo "=== Running unit tests ==="
            cargo test \
              --workspace \
              --bins \
              --lib \
              --exclude tng-wasm \
              -- --nocapture

      - name: Run integration tests
        uses: google-github-actions/ssh-compute@v2
        with:
          instance_name: ${{ steps.vm.outputs.name }}
          zone: ${{ env.GCP_ZONE }}
          project_id: ${{ env.GCP_PROJECT }}
          ssh_private_key: ${{ steps.vm.outputs.ssh_private_key }}
          user: cirunner
          script: |
            set -e
            source "$HOME/.cargo/env"
            cd /workspace

            echo "=== Running integration tests ==="
            failed=0
            for test_file in tng-testsuite/tests/*.rs; do
              case_name=$(basename "$test_file" .rs)
              echo "============= Integration test: $case_name ============="
              if ! cargo test \
                --no-default-features \
                --features on-source-code \
                --package tng-testsuite \
                --test "$case_name" \
                -- --nocapture; then
                echo "FAILED: $case_name"
                failed=1
              fi
            done
            exit $failed

      - name: Delete TDX VM
        if: always()
        run: |
          VM_NAME="${{ steps.vm.outputs.name }}"
          if [ -n "$VM_NAME" ]; then
            echo "Deleting VM: $VM_NAME"
            gcloud compute instances delete "$VM_NAME" \
              --project="$GCP_PROJECT" \
              --zone="$GCP_ZONE" \
              --quiet 2>/dev/null || echo "VM already deleted or not found"
          fi
