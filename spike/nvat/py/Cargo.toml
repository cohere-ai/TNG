[package]
name = "nvat-spike-py"
version = "0.0.0"
edition = "2021"
publish = false

# A stand-in for the cohere-tng extension module: how a wheel linking libnvat gets built,
# bundled (auditwheel / delocate) and loaded.
[lib]
name = "nvat_spike"
crate-type = ["cdylib"]

[dependencies]
nvat-spike-verify = {path = "../verify"}
# As cohere-tng (cohere/python/cohere-tng/Cargo.toml).
pyo3 = {version = "0.29", features = ["extension-module", "abi3-py38"]}
serde_json = "1"
