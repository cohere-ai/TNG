syntax = "proto3";

package tng.rats_tls.attestation_exchange;

// One proposal per verifier this side holds; empty when it does not verify its peer.
message Request {
  repeated AttestProposal proposals = 1;
}

message AttestProposal {
  oneof kind {
    BackgroundCheck background_check = 1;
    Passport passport = 2;
  }
}

message BackgroundCheck {
  string provider = 1;
  string challenge_token = 2;
}

message Passport {
  string provider = 1;
}

message Response {
  oneof body {
    None ack = 1;
    Evidence evidence = 2;
    Token token = 3;
    Error error = 4;
  }
}

message None {}

message Error {
  string reason = 1;
}

message Evidence {
  string provider = 1;
  string json = 2;
}

message Token {
  string provider = 1;
  string jwt = 2;
}
